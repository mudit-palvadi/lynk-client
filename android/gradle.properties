# R8 (isMinifyEnabled) is memory hungry, and the release pipeline runs on a
# Mac mini M2 with 8 GB of RAM. The Flutter template's -Xmx8G plus a 4 GB
# metaspace reservation asks for more than that machine can give, and the
# daemon dies with a G1 "failed to map" error before R8 even starts. 4 GB of
# heap and 1 GB of metaspace fits the runner and is enough for R8 on this
# project.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

dev.steenbakker.mobile_scanner.useUnbundled=true
