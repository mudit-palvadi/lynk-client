# Lynk — Android release pipeline
#
# Manually triggered only: it builds a signed release AAB and uploads it to the
# Google Play closed testing track. Nothing runs on push.
#
# One-time setup required in the Codemagic UI:
#   1. Team settings > codemagic.yaml settings > Code signing identities >
#      Android keystores: upload android/app/upload-keystore.jks with the
#      reference name `lynk_upload_keystore` (paths/passwords from android/key.properties).
#   2. Env group `lynk_config`: API_BASE_URL, PRIVACY_POLICY_URL, DEEP_LINK_BASE_URL,
#      ADMOB_APP_ID, ADMOB_BANNER_ID, ADMOB_INTERSTITIAL_ID, ADMOB_REWARDED_ID,
#      ADMOB_REWARDED_INTERSTITIAL_ID
#   3. Env group `google_play`: GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS (service account JSON key content)

workflows:
  lynk-android-release:
    name: Lynk Android Release (Closed Testing)
    max_build_duration: 60
    # Mac mini M2 is the only machine included in the Codemagic free plan
    # (500 min/month). Linux X2 requires enabling pay-as-you-go billing.
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.6
      # Gradle 9.1 / AGP 9.0 require JDK 17+; pin 21 for a deterministic build.
      java: 21
      groups:
        - lynk_config
        - google_play
      android_signing:
        - lynk_upload_keystore

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Recreate .env
        script: |
          # DEV_CONFIG_KEY is gone: the ad bypass is a compile-time define
          # (LYNK_DEBUG_BYPASS_KEY) that only exists in debug builds, so no
          # released APK can carry a working bypass.
          cat > $CM_BUILD_DIR/.env <<EOF
          API_BASE_URL=$API_BASE_URL
          PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL
          DEEP_LINK_BASE_URL=$DEEP_LINK_BASE_URL
          ADMOB_APP_ID=$ADMOB_APP_ID
          ADMOB_BANNER_ID=$ADMOB_BANNER_ID
          ADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID
          ADMOB_REWARDED_ID=$ADMOB_REWARDED_ID
          ADMOB_REWARDED_INTERSTITIAL_ID=$ADMOB_REWARDED_INTERSTITIAL_ID
          EOF

      - name: Verify release configuration
        script: |
          # Fail before the build rather than shipping an APK that shows test
          # ads. The Gradle build also refuses the sample AdMob app id for a
          # release build, but a missing *ad unit* id would only disable ads
          # at runtime, so it is checked here.
          missing=""
          for var in ADMOB_APP_ID ADMOB_BANNER_ID ADMOB_INTERSTITIAL_ID ADMOB_REWARDED_ID ADMOB_REWARDED_INTERSTITIAL_ID; do
            value=$(printenv $var)
            if [ -z "$value" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "ERROR: missing AdMob configuration in the lynk_config env group:$missing"
            echo "The release build needs the real AdMob app id and ad unit ids."
            exit 1
          fi
          if [ "$ADMOB_APP_ID" = "ca-app-pub-3940256099942544~3347511713" ]; then
            echo "ERROR: ADMOB_APP_ID is Google's sample id. A release build must use the real one."
            exit 1
          fi
          # Gradle reads the app id from this property.
          export ORG_GRADLE_PROJECT_admobAppId=$ADMOB_APP_ID

      - name: Set up Android signing (key.properties)
        script: |
          cat > $CM_BUILD_DIR/android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze
        script: |
          flutter analyze

      - name: Run tests
        script: |
          flutter test

      - name: Build release AAB
        script: |
          # build number = Codemagic project build counter + 100, so the first CI
          # build is versionCode 101 — always higher than any manual +N upload.
          # --obfuscate + --split-debug-info keep the Dart symbols out of the
          # AAB and write them to build/symbols, which is uploaded as an
          # artifact so a Play crash report can still be de-obfuscated.
          flutter build appbundle --release \
            --build-number=$(($PROJECT_BUILD_NUMBER + 100)) \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Verify signing certificate (must not say "Android Debug")
        script: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "Owner:|SHA256:"

      - name: Verify the release manifest has the real AdMob app id
        script: |
          # The manifest is merged at build time, so read it back from the
          # packaged AAB rather than from the source file. The manifest inside
          # an AAB is binary, but the application id is still greppable in the
          # string pool, which is all this check needs.
          #
          # An `if` is used deliberately: `grep -q ... && { exit 1; }` would
          # make the step fail on the *success* path, because the list would
          # then end with grep's "not found" status.
          aab=build/app/outputs/bundle/release/app-release.aab
          sample=ca-app-pub-3940256099942544~3347511713
          if unzip -p "$aab" base/manifest/AndroidManifest.xml | grep -q "$sample"; then
            echo "ERROR: the release manifest still carries Google's sample AdMob app id."
            exit 1
          fi
          if ! unzip -p "$aab" base/manifest/AndroidManifest.xml | grep -q "$ADMOB_APP_ID"; then
            echo "ERROR: the release manifest does not carry the configured AdMob application id ($ADMOB_APP_ID)."
            exit 1
          fi
          echo "OK: the release manifest carries the configured AdMob app id."

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      # Dart obfuscation symbols: needed to read a Play stack trace.
      - build/symbols

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        # "alpha" = default closed testing track. If your closed track has a
        # custom name, put it here instead. Can also be overridden per build
        # with the GOOGLE_PLAY_TRACK environment variable.
        track: alpha
        submit_as_draft: false

    # Optional: uncomment to also auto-release when a version tag is pushed.
    #triggering:
    #  events:
    #    - tag
    #  tag_patterns:
    #    - pattern: 'v*'
    #      include: true
