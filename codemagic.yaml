# Lynk — Android release pipeline
#
# Manually triggered only: it builds a signed release AAB and uploads it to the
# Google Play open testing track. Nothing runs on push.
#
# One-time setup required in the Codemagic UI:
#   1. Team settings > codemagic.yaml settings > Code signing identities >
#      Android keystores: upload android/app/upload-keystore.jks with the
#      reference name `lynk_upload_keystore` (paths/passwords from android/key.properties).
#   2. Env group `lynk_config`: API_BASE_URL, PRIVACY_POLICY_URL, DEEP_LINK_BASE_URL,
#      and ADMOB_APP_ID, ADMOB_BANNER_ID, ADMOB_INTERSTITIAL_ID,
#      ADMOB_REWARDED_ID, ADMOB_REWARDED_INTERSTITIAL_ID.
#      All five must be real IDs from the same AdMob publisher. Sample IDs and
#      missing configuration stop the release; debug/profile retain test ads.
#   3. Env group `google_play`: GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS (service account JSON key content)

workflows:
  lynk-android-release:
    name: Lynk Android Release (Open Testing)
    max_build_duration: 60
    # Mac mini M2 is the only machine included in the Codemagic free plan
    # (500 min/month). Linux X2 requires enabling pay-as-you-go billing.
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.6
      # Gradle 9.1 / AGP 9.0 require JDK 17+; pin 21 for a deterministic build.
      java: 21
      # Public AdMob identifiers, not account credentials. Environment-group
      # overrides must pass the same release validation.
      vars:
        ADMOB_APP_ID: ca-app-pub-9472143004063972~5082510676
        ADMOB_BANNER_ID: ca-app-pub-9472143004063972/3345777238
        ADMOB_INTERSTITIAL_ID: ca-app-pub-9472143004063972/9528042202
        ADMOB_REWARDED_ID: ca-app-pub-9472143004063972/1768498260
        ADMOB_REWARDED_INTERSTITIAL_ID: ca-app-pub-9472143004063972/5516171584
      groups:
        - lynk_config
        - google_play
      android_signing:
        - lynk_upload_keystore

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Resolve AdMob configuration
        script: |
          set -eu
          if [ "${GOOGLE_PLAY_TRACK:-beta}" != beta ]; then
            echo "ERROR: this workflow publishes to open testing (beta) only."
            exit 1
          fi
          expected_publisher=''
          for var in ADMOB_APP_ID ADMOB_BANNER_ID ADMOB_INTERSTITIAL_ID ADMOB_REWARDED_ID ADMOB_REWARDED_INTERSTITIAL_ID; do
            value="$(printenv "$var" || true)"
            separator=/
            if [ "$var" = ADMOB_APP_ID ]; then separator='~'; fi
            if ! printf '%s' "$value" | grep -Eq "^ca-app-pub-[0-9]{16}${separator}[0-9]{10}$"; then
              echo "ERROR: $var must contain a valid real AdMob ID."
              exit 1
            fi
            if printf '%s' "$value" | grep -q '^ca-app-pub-3940256099942544'; then
              echo "ERROR: Google sample IDs cannot be used in an open-testing release."
              exit 1
            fi
            publisher="$(printf '%s' "$value" | cut -c 1-27)"
            if [ -n "${expected_publisher:-}" ] && [ "$publisher" != "$expected_publisher" ]; then
              echo "ERROR: all AdMob IDs must belong to the same publisher."
              exit 1
            fi
            expected_publisher="$publisher"
          done
          # Written to a file rather than exported, because Codemagic does not
          # guarantee that an export in one step survives into the next one.
          {
            echo "export ADMOB_APP_ID=\"$ADMOB_APP_ID\""
            echo "export ADMOB_BANNER_ID=\"$ADMOB_BANNER_ID\""
            echo "export ADMOB_INTERSTITIAL_ID=\"$ADMOB_INTERSTITIAL_ID\""
            echo "export ADMOB_REWARDED_ID=\"$ADMOB_REWARDED_ID\""
            echo "export ADMOB_REWARDED_INTERSTITIAL_ID=\"$ADMOB_REWARDED_INTERSTITIAL_ID\""
            echo "export ORG_GRADLE_PROJECT_admobAppId=\"$ADMOB_APP_ID\""
          } > "$CM_BUILD_DIR/.admob-release.env"

      - name: Recreate .env
        script: |
          . $CM_BUILD_DIR/.admob-release.env
          # DEV_CONFIG_KEY is gone: the ad bypass is a compile-time define
          # (LYNK_DEBUG_BYPASS_KEY) that only exists in debug builds, so no
          # released APK can carry a working bypass.
          cat > $CM_BUILD_DIR/.env <<EOF
          API_BASE_URL=$API_BASE_URL
          PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL
          DEEP_LINK_BASE_URL=$DEEP_LINK_BASE_URL
          ADMOB_APP_ID=$ADMOB_APP_ID
          ADMOB_BANNER_ID=$ADMOB_BANNER_ID
          ADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID
          ADMOB_REWARDED_ID=$ADMOB_REWARDED_ID
          ADMOB_REWARDED_INTERSTITIAL_ID=$ADMOB_REWARDED_INTERSTITIAL_ID
          EOF

      - name: Set up Android signing (key.properties)
        script: |
          cat > $CM_BUILD_DIR/android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze
        script: |
          flutter analyze

      - name: Run tests
        script: |
          flutter test

      - name: Build release AAB
        script: |
          . $CM_BUILD_DIR/.admob-release.env
          # versionCode = Codemagic project build counter + 100. Before starting
          # a build, verify it exceeds every version already uploaded to Play.
          # --obfuscate + --split-debug-info keep the Dart symbols out of the
          # AAB and write them to build/symbols, which is uploaded as an
          # artifact so a Play crash report can still be de-obfuscated.
          flutter build appbundle --release \
            --build-number=$(($PROJECT_BUILD_NUMBER + 100)) \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Verify release upload signing certificate
        script: |
          set -eu
          aab=build/app/outputs/bundle/release/app-release.aab
          certificate="$(keytool -J-Duser.language=en -printcert -jarfile "$aab")"
          expected='74:25:40:24:ED:53:EF:1F:A7:8F:00:B7:D1:72:7B:6A:CC:4B:12:B9:20:8D:EB:8D:48:11:58:6C:6C:C8:F0:94'
          actual="$(printf '%s\n' "$certificate" | sed -n 's/.*SHA256: //p' | tr -d '\r')"
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: the bundle is not signed with the registered upload certificate."
            exit 1
          fi
          jarsigner -J-Duser.language=en -verify "$aab" | grep -q 'jar verified'

      - name: Verify the release manifest carries the configured AdMob app id
        script: |
          . $CM_BUILD_DIR/.admob-release.env
          # The manifest is merged at build time, so read it back from the
          # packaged AAB rather than from the source file. The manifest inside
          # an AAB is binary, but the application id is still greppable in the
          # string pool, which is all this check needs.
          #
          # An `if` is used deliberately: `grep -q ... && { exit 1; }` would
          # make the step fail on the *success* path, because the list would
          # then end with grep's "not found" status.
          aab=build/app/outputs/bundle/release/app-release.aab
          test_id=ca-app-pub-3940256099942544~3347511713
          if unzip -p "$aab" base/manifest/AndroidManifest.xml | grep -qF "$test_id"; then
            echo "ERROR: the release manifest still carries Google's public test AdMob app id."
            exit 1
          fi
          if ! unzip -p "$aab" base/manifest/AndroidManifest.xml | grep -qF "$ADMOB_APP_ID"; then
            echo "ERROR: the release manifest does not carry the configured AdMob application id ($ADMOB_APP_ID)."
            exit 1
          fi
          echo "OK: the release manifest carries the configured AdMob app id ($ADMOB_APP_ID)."

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      # Dart obfuscation symbols: needed to read a Play stack trace.
      - build/symbols
      # R8 mapping for the minified Java/Kotlin side. The release buildType
      # sets isMinifyEnabled, so a Play crash report from a release build
      # cannot be de-obfuscated without this file. It is large (~60 MB) but
      # it is the only way to read a minified stack trace.
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        # beta is open testing. A GOOGLE_PLAY_TRACK override other than beta
        # is rejected by the first script, including production.
        track: beta
        submit_as_draft: false
