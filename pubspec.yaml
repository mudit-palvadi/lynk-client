name: client
description: "LynkShare - private, zero-registration file sharing between your devices."
publish_to: "none"
version: 0.1.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  dio: ^5.10.0
  file_picker: 10.3.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  equatable: ^2.1.0
  flutter_dotenv: ^6.0.1
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3
  smooth_page_indicator: ^2.0.1
  riverpod_annotation: ^4.0.3
  go_router: ^14.8.1
  encrypt: ^5.0.3
  crypto: ^3.0.7
  cryptography: ^2.7.0
  uuid: ^4.6.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  flutter_webrtc: ^1.6.0
  web_socket_channel: ^3.0.3
  package_info_plus: ^9.0.1
  in_app_update: 5.0.0

dev_dependencies:
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.1

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  xml: ^6.6.1
  yaml: ^3.1.3
  path_provider_platform_interface: ^2.1.3
flutter:
  uses-material-design: true

  assets:
    - .env
    - shorebird.yaml
