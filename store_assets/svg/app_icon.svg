<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="55%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00BFA5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="47%" r="62%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#00C77E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00BFA5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed dark tile (store masks shape the corners) -->
  <rect x="0" y="0" width="512" height="512" fill="#0A0A0A"/>

  <!-- ambient glow behind glyph -->
  <ellipse cx="256" cy="252" rx="230" ry="230" fill="url(#glow)"/>

  <!-- QR finder brackets: top-left, top-right, bottom-left -->
  <g stroke="#1FBF8F" stroke-width="17" stroke-linecap="round" fill="none" opacity="0.72">
    <path d="M 104 148 L 104 116 Q 104 104 116 104 L 148 104"/>
    <path d="M 364 104 L 396 104 Q 408 104 408 116 L 408 148"/>
    <path d="M 104 364 L 104 396 Q 104 408 116 408 L 148 408"/>
  </g>
  <!-- bracket corner dots -->
  <circle cx="408" cy="408" r="9" fill="#1FBF8F" opacity="0.72"/>

  <!-- interlocked chain links -->
  <g transform="translate(256 260) rotate(-20) scale(0.86)">
    <!-- back link -->
    <rect x="-130" y="-112" width="150" height="224" rx="75"
          fill="none" stroke="url(#linkGrad)" stroke-width="36"/>
    <!-- front link, drawn over -->
    <rect x="-20" y="-112" width="150" height="224" rx="75"
          fill="none" stroke="url(#linkGrad)" stroke-width="36"/>
  </g>
</svg>
